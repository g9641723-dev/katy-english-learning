<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龔雅屏教學網站</title><style>body{margin:0;background:#f3f6fa;color:#21364b;font:16px system-ui,sans-serif}header{background:#193b5a;color:white;padding:3rem 6%}h1{font-size:2.5rem;margin:.3em 0}main{max-width:1000px;margin:2rem auto;padding:0 1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}a.card{display:block;background:white;border:1px solid #dce5ed;border-radius:12px;padding:1.5rem;color:#16476d;text-decoration:none;min-height:100px}a.card:hover{box-shadow:0 6px 20px #1232}small{color:#71859a}footer{margin-top:2rem}</style><header><small style="color:#c1d7e5">ENGLISH LEARNING RESOURCES</small><h1>龔雅屏教學網站</h1><p>一起學英文，從每一天的小進步開始。</p></header><main><h2>學習資源</h2><p>選擇單元，開啟原 Google 教學網站；教材與互動活動依原有權限使用。</p><div class="grid" id="links"></div><footer><a href="https://sites.google.com/dsjh.ptc.edu.tw/katygong123456/%E9%A0%81%E5%B0%BE">原網站頁尾</a></footer></main><script>const base='https://sites.google.com/dsjh.ptc.edu.tw/katygong123456/';const items=[['自然發音','首頁/自然發音','發音影片與單字練習'],['七年級','首頁/七年級','七年級教材'],['八年級','首頁/八年級','八年級教材'],['九年級','首頁/九年級','單字、會考與文法資源'],['遊戲學英文','首頁/九年級/遊戲學英文','互動遊戲'],['原網站首頁','首頁','開啟原網站']];for(const [title,path,desc] of items){const a=document.createElement('a');a.className='card';a.href=base+path.split('/').map(encodeURIComponent).join('/');const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=desc+' →';a.append(h,p);document.querySelector('#links').append(a)}</script></html>
